name: Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run Maven tests
        run: mvn -B clean test -Dheadless=true -Dbrowser=chrome

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output/
            target/
